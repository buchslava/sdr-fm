<main class="rigonda-console">
  <section class="faceplate">
    <app-rigonda-dial
      [stations]="store.stations()"
      [selectedId]="store.selectedId()"
      [scanHits]="scanHits()"
      [disabled]="false"
      (stationSelected)="selectStation($event)"
      (noPresetNearby)="onNoPresetNearby()"
    />

    <div class="readout-strip">
      <div class="readout">
        <span class="readout-label">Tuned</span>
        <span class="readout-freq">
          @if (store.selectedStation(); as station) {
            {{ formatMhz(station.frequencyKhz) }} MHz
          } @else {
            —
          }
        </span>
        <span class="readout-name">
          @if (store.selectedStation(); as station) {
            {{ stationLabel(station) }}
          } @else {
            No preset selected
          }
        </span>
      </div>

      <div class="crud-actions">
        <button
          type="button"
          class="vintage-btn icon-btn"
          title="Add station"
          (click)="openAdd()"
          [disabled]="crudDisabled()"
        >
          +
        </button>
        <button
          type="button"
          class="vintage-btn"
          title="Edit station"
          (click)="openEditSelected()"
          [disabled]="crudDisabled() || !store.selectedId()"
        >
          Edit
        </button>
        <button
          type="button"
          class="vintage-btn icon-btn"
          title="Remove station"
          (click)="deleteSelected()"
          [disabled]="crudDisabled() || !store.selectedId()"
        >
          ×
        </button>
      </div>
    </div>
  </section>

  <div class="transport">
    <select
      class="city-select"
      title="City presets"
      [disabled]="isPlaying() || isScanning()"
      [value]="store.cityId()"
      (change)="onCityChange($event)"
    >
      @for (city of store.cities(); track city.id) {
        <option [value]="city.id">{{ city.name }}</option>
      }
    </select>
    <button
      type="button"
      class="vintage-btn transport-btn"
      (click)="scanBand()"
      [disabled]="isPlaying() || isScanning()"
      title="Scan FM band (power + RDS)"
    >
      Scan
    </button>
    <button
      type="button"
      class="vintage-btn transport-btn"
      (click)="listen()"
      [disabled]="isPlaying() || isScanning() || !store.selectedId()"
    >
      Start
    </button>
    <button
      type="button"
      class="vintage-btn transport-btn"
      (click)="stop()"
      [disabled]="!isPlaying() || isScanning()"
    >
      Stop
    </button>
  </div>

  <p class="status-bar" [class.error]="!!error()">{{ statusLine() }}</p>
</main>

@if (modalOpen()) {
  <app-station-form-modal
    [mode]="modalMode()"
    [station]="modalStation()"
    [stations]="store.stations()"
    (saved)="onModalSave($event)"
    (closed)="closeModal()"
  />
}
