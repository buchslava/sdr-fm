<main class="winamp-panel">
  <div class="station-list">
    <div class="station-list-header">
      <span class="col-freq">Freq</span>
      <span class="col-name">Name</span>
      <span class="header-actions">
        <button
          type="button"
          class="icon-btn"
          title="Add station"
          (click)="openAdd()"
          [disabled]="crudDisabled()"
        >
          +
        </button>
        <button
          type="button"
          class="icon-btn"
          title="Remove station"
          (click)="deleteSelected()"
          [disabled]="crudDisabled() || !store.selectedId()"
        >
          ×
        </button>
      </span>
    </div>
    <div class="station-list-body">
      @for (station of store.stations(); track station.id) {
        <button
          type="button"
          class="station-row"
          [class.selected]="store.selectedId() === station.id"
          (click)="selectStation(station.id)"
          (dblclick)="openEdit(station)"
        >
          <span class="col-freq">{{ formatMhz(station.frequencyKhz) }}</span>
          <span class="col-name">{{ station.name }}</span>
        </button>
      }
    </div>
  </div>

  <div class="transport">
    <select
      class="city-select"
      title="City presets"
      [disabled]="isPlaying() || isScanning()"
      [value]="store.cityId()"
      (change)="onCityChange($event)"
    >
      @for (city of store.cities(); track city.id) {
        <option [value]="city.id">{{ city.name }}</option>
      }
    </select>
    <button
      type="button"
      class="transport-btn"
      (click)="scanBand()"
      [disabled]="isPlaying() || isScanning()"
      title="Scan FM band (power + RDS)"
    >
      Scan
    </button>
    <button
      type="button"
      class="transport-btn"
      (click)="listen()"
      [disabled]="isPlaying() || isScanning() || !store.selectedId()"
    >
      Start
    </button>
    <button
      type="button"
      class="transport-btn"
      (click)="stop()"
      [disabled]="!isPlaying() || isScanning()"
    >
      Stop
    </button>
  </div>

  <p class="status-bar" [class.error]="!!error()">{{ statusLine() }}</p>
</main>

@if (modalOpen()) {
  <app-station-form-modal
    [mode]="modalMode()"
    [station]="modalStation()"
    [stations]="store.stations()"
    (saved)="onModalSave($event)"
    (closed)="closeModal()"
  />
}
